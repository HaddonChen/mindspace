
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSpace</title>

    <style>
        :root {
            --dark: #363636;
            --light: #F0EEE8;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: var(--dark);
            color: var(--light);
        }

        /* Sidebar */
        aside {
            width: var(--sidebar-width);
            flex-shrink: 0;
            background-color: var(--light);
            color: var(--dark);
            border-right: 1px solid var(--dark);
            display: flex;
            flex-direction: column;
            padding: 28px 20px;
        }

        .brand h2 {
            font-size: 1.6rem;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .brand p {
            font-size: 0.85rem;
            color: var(--dark);
            margin-bottom: 35px;
        }

        .nav-links {
            list-style: none;
        }

        .nav-item {
            padding: 14px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
            border: 1px solid transparent;
            transition: background-color 0.2s ease,
                        color 0.2s ease;
        }

        .nav-item span {
            font-size: 1rem;
        }

        .nav-item:hover,
        .nav-item.active {
            background-color: var(--dark);
            color: var(--light);
            border-color: var(--dark);
        }

        /* Main workspace */
        main {
            flex: 1;
            min-width: 0;
            padding: 48px;
            overflow-y: auto;
        }

        .view {
            display: none;
            flex-direction: column;
            min-height: 100%;
        }

        .view.active {
            display: flex;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: -0.8px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--light);
            opacity: 0.8;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Todo input */
        .todo-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 14px;
            background-color: var(--light);
            border: 1px solid var(--light);
            color: var(--dark);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: var(--dark);
            opacity: 0.7;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--light);
            box-shadow: 0 0 0 2px var(--light);
        }

        button {
            font: inherit;
        }

        .btn-primary {
            background-color: var(--light);
            color: var(--dark);
            border: 1px solid var(--light);
            padding: 0 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: background-color 0.2s ease,
                        color 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--dark);
            color: var(--light);
        }

        .btn-primary:focus-visible,
        .btn-icon:focus-visible,
        .nav-item:focus-visible {
            outline: 2px solid var(--light);
            outline-offset: 3px;
        }

        /* Todo list */
        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px 16px;
            background-color: var(--light);
            color: var(--dark);
            border: 1px solid var(--light);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        .todo-item span {
            flex: 1;
            line-height: 1.5;
        }

        .todo-item.completed span {
            text-decoration: line-through;
            opacity: 0.65;
        }

        .todo-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--dark);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            border-radius: 4px;
        }

        .btn-icon:hover {
            opacity: 0.65;
        }

        /* Notes */
        .notes-area {
            flex: 1;
            min-height: 300px;
            resize: vertical;
            line-height: 1.8;
        }

        /* Empty state */
        .empty-state {
            color: var(--light);
            opacity: 0.75;
            padding: 24px 0;
            line-height: 1.6;
        }

        /* Responsive layout */
        @media (max-width: 700px) {
            body {
                flex-direction: column;
            }

            aside {
                width: 100%;
                padding: 18px 20px;
                border-right: none;
                border-bottom: 1px solid var(--dark);
            }

            .brand h2 {
                margin-bottom: 16px;
            }

            .brand p {
                margin-bottom: 16px;
            }

            .nav-links {
                display: flex;
                gap: 10px;
            }

            .nav-item {
                flex: 1;
                text-align: center;
                margin-bottom: 0;
            }

            main {
                padding: 28px 20px;
            }

            h1 {
                font-size: 1.7rem;
            }

            .todo-input-container {
                flex-direction: column;
            }

            .btn-primary {
                min-height: 46px;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar navigation -->
    <aside>
        <div class="brand">
            <h2>MindSpace</h2>
            <p>A little space to think.</p>

            <nav aria-label="Main navigation">
                <ul class="nav-links">
                    <li>
                        <button
                            type="button"
                            class="nav-item active"
                            data-view="todo"
                            aria-current="page"
                            style="width: 100%; text-align: left;"
                        >
                            <span>Todo</span>
                        </button>
                    </li>
                    <li>
                        <button
                            type="button"
                            class="nav-item"
                            data-view="notes"
                            style="width: 100%; text-align: left;"
                        >
                            <span>Notes</span>
                        </button>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Main workspace -->
    <main>
        <!-- Todo view -->
        <section id="todo-view" class="view active">
            <h1>To Do</h1>
            <p class="subtitle">
                Externalise your mental clutter. Keep it out of your head.
            </p>

            <form id="todo-form" class="todo-input-container">
                <input
                    type="text"
                    id="todo-input"
                    placeholder="What's taking up your mental space?"
                    aria-label="New task"
                    maxlength="500"
                    autocomplete="off"
                >
                <button type="submit" class="btn-primary">
                    Capture
                </button>
            </form>

            <ul class="todo-list" id="todo-list"></ul>
            <p id="empty-state" class="empty-state">
                Nothing on your mind? Enjoy the space.
            </p>
        </section>

        <!-- Notes view -->
        <section id="notes-view" class="view">
            <h1>Notes</h1>
            <p class="subtitle">
                A friction-free canvas for raw processing and loose thinking.
            </p>

            <textarea
                id="notes-input"
                class="notes-area"
                placeholder="Start rambling here... Everything you write is instantly preserved."
                aria-label="Your notes"
            ></textarea>
        </section>
    </main>

    <script>
        // State and persistence
        const STORAGE_KEY = "mindspace_data_clean";

        let appState = {
            todos: [],
            notes: ""
        };

        function loadState() {
            try {
                const savedData = localStorage.getItem(STORAGE_KEY);

                if (savedData) {
                    const parsed = JSON.parse(savedData);

                    appState = {
                        todos: Array.isArray(parsed.todos)
                            ? parsed.todos.filter(todo =>
                                todo &&
                                typeof todo.text === "string" &&
                                typeof todo.id === "number"
                            )
                            : [],
                        notes: typeof parsed.notes === "string"
                            ? parsed.notes
                            : ""
                    };
                }
            } catch (error) {
                console.warn("Could not load MindSpace data.", error);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(appState)
                );
            } catch (error) {
                console.warn("Could not save MindSpace data.", error);
            }
        }

        // Navigation
        function switchView(viewName) {
            document.querySelectorAll(".view").forEach(view => {
                view.classList.toggle(
                    "active",
                    view.id === `${viewName}-view`
                );
            });

            document.querySelectorAll(".nav-item").forEach(item => {
                const isActive = item.dataset.view === viewName;

                item.classList.toggle("active", isActive);

                if (isActive) {
                    item.setAttribute("aria-current", "page");
                } else {
                    item.removeAttribute("aria-current");
                }
            });
        }

        document.querySelectorAll(".nav-item").forEach(item => {
            item.addEventListener("click", () => {
                switchView(item.dataset.view);
            });
        });

        // Todo functions
        function addTodo(text) {
            const trimmedText = text.trim();

            if (!trimmedText) return;

            appState.todos.push({
                id: Date.now(),
                text: trimmedText,
                completed: false
            });

            saveState();
            renderTodos();
        }

        function toggleTodo(id) {
            appState.todos = appState.todos.map(todo =>
                todo.id === id
                    ? { ...todo, completed: !todo.completed }
                    : todo
            );

            saveState();
            renderTodos();
        }

        function deleteTodo(id) {
            appState.todos = appState.todos.filter(
                todo => todo.id !== id
            );

            saveState();
            renderTodos();
        }

        function renderTodos() {
            const list = document.getElementById("todo-list");
            const emptyState = document.getElementById("empty-state");

            list.replaceChildren();

            appState.todos.forEach(todo => {
                const li = document.createElement("li");
                li.className = "todo-item";

                if (todo.completed) {
                    li.classList.add("completed");
                }

                const text = document.createElement("span");
                text.textContent = todo.text;

                const actions = document.createElement("div");
                actions.className = "todo-actions";

                const toggleButton = document.createElement("button");
                toggleButton.type = "button";
                toggleButton.className = "btn-icon";
                toggleButton.textContent = todo.completed ? "↩" : "✓";
                toggleButton.setAttribute(
                    "aria-label",
                    todo.completed
                        ? `Mark ${todo.text} incomplete`
                        : `Complete ${todo.text}`
                );
                toggleButton.addEventListener("click", () => {
                    toggleTodo(todo.id);
                });

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "btn-icon";
                deleteButton.textContent = "×";
                deleteButton.setAttribute(
                    "aria-label",
                    `Delete ${todo.text}`
                );
                deleteButton.addEventListener("click", () => {
                    deleteTodo(todo.id);
                });

                actions.append(toggleButton, deleteButton);
                li.append(text, actions);
                list.appendChild(li);
            });

            emptyState.hidden = appState.todos.length > 0;
        }

        // Todo form: supports both clicking Capture and pressing Enter
        document.getElementById("todo-form").addEventListener(
            "submit",
            event => {
                event.preventDefault();

                const input = document.getElementById("todo-input");

                addTodo(input.value);
                input.value = "";
                input.focus();
            }
        );

        // Notes: save as the user types
        const notesInput = document.getElementById("notes-input");

        notesInput.addEventListener("input", () => {
            appState.notes = notesInput.value;
            saveState();
        });

        // Startup
        loadState();

        notesInput.value = appState.notes;
        renderTodos();
    </script>
</body>
</html>
