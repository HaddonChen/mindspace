<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindSpace</title>
    <style>
        :root {
            --bg-primary: #363636;
            --bg-secondary: #bebdb8;
            --text-primary: #f0eee8;
            --text-secondary: #d30000;
            --accent: #f0eee8;
            --accent-hover: #3b5bdb;
            --border: #dee2e6;
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* Sidebar Navigation */
        aside {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .brand h2 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: var(--accent);
        }

        .brand p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        .nav-links {
            list-style: none;
            flex-grow: 1;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .nav-item span {
            font-size: 1rem;
        }

        .nav-item small {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: var(--bg-primary);
            color: var(--accent);
            border-left: 4px solid var(--accent);
        }

        /* Main Content Workspace */
        main {
            flex-grow: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .view {
            display: none;
            height: 100%;
            flex-direction: column;
        }

        .view.active {
            display: flex;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        /* Todo Module Elements */
        .todo-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent);
        }

        button.btn-primary {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            white-space: nowrap;
            transition: background-color 0.2s ease;
        }

        button.btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .todo-item.completed span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .todo-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-icon:hover {
            color: var(--accent);
        }

        /* Notes Module Elements */
        .notes-area {
            flex-grow: 1;
            resize: none;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside>
        <div class="brand">
            <h2>MindSpace</h2>
            <ul class="nav-links">
                <li class="nav-item active" onclick="switchView('todo')">
                    <span>Todo</span>
                </li>
                <li class="nav-item" onclick="switchView('notes')">
                    <span>Notes</span>
                </li>
            </ul>
        </div>
    </aside>

    <!-- Main Content Workspace -->
    <main>
        <!-- Todo Workspace -->
        <div id="todo-view" class="view active">
            <h1>To Do</h1>
            <p class="subtitle">Externalise your mental clutter. Keep it out of your head.</p>
            
            <div class="todo-input-container">
                <input type="text" id="todo-input" placeholder="What's taking up your mental space?">
                <button class="btn-primary" onclick="addTodo()">Capture</button>
            </div>

            <ul class="todo-list" id="todo-list"></ul>
        </div>

        <!-- Notes Workspace -->
        <div id="notes-view" class="view">
            <h1>Notes</h1>
            <p class="subtitle">A friction-free canvas for raw processing and loose thinking.</p>
            <textarea id="notes-input" class="notes-area" placeholder="Start rambling here... Everything you write is instantly preserved." oninput="saveNotes()"></textarea>
        </div>
    </main>

    <script>
        // --- State Management & Persistence ---
        let appState = {
            todos: [],
            notes: ''
        };

        // Load data on startup
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('mindspace_data_clean');
            if (savedData) {
                appState = JSON.parse(savedData);
            }
            renderTodos();
            document.getElementById('notes-input').value = appState.notes || '';
        });

        function saveState() {
            localStorage.setItem('mindspace_data_clean', JSON.stringify(appState));
        }

        // --- Navigation Engine ---
        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            document.getElementById(`${viewName}-view`).classList.add('active');
            
            // Highlight active nav element
            const index = viewName === 'todo' ? 0 : 1;
            document.querySelectorAll('.nav-item')[index].classList.add('active');
        }

        // --- Todo Engine ---
        function addTodo() {
            const input = document.getElementById('todo-input');
            const text = input.value.trim();
            if (!text) return;

            const newTodo = {
                id: Date.now(),
                text: text,
                completed: false
            };

            appState.todos.push(newTodo);
            input.value = '';
            renderTodos();
            saveState();
        }

        function toggleTodo(id) {
            appState.todos = appState.todos.map(todo => 
                todo.id === id ? { ...todo, completed: !todo.completed } : todo
            );
            renderTodos();
            saveState();
        }

        function deleteTodo(id) {
            appState.todos = appState.todos.filter(todo => todo.id !== id);
            renderTodos();
            saveState();
        }

        function renderTodos() {
            const list = document.getElementById('todo-list');
            list.innerHTML = '';

            appState.todos.forEach(todo => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                
                li.innerHTML = `
                    <span>${todo.text}</span>
                    <div class="todo-actions">
                        <button class="btn-icon" onclick="toggleTodo(${todo.id})">${todo.completed ? '↩️' : '✅'}</button>
                        <button class="btn-icon" onclick="deleteTodo(${todo.id})">🗑️</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        // --- Notes Engine ---
        function saveNotes() {
            appState.notes = document.getElementById('notes-input').value;
            saveState();
        }

        // Form submission intercept for enter key on input
        document.getElementById('todo-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });
    </script>
</body>
</html>
